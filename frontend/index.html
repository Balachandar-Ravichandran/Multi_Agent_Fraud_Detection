<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterling Industrial Works — Fraud Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css?v=3">
</head>
<body>

<div class="app-shell">

  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button type="button" class="new-session-btn" id="new-session-btn">+ New audit</button>
    </div>
    <div class="sidebar-label">Sessions</div>
    <ul class="session-list" id="session-list"></ul>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sessions">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-mark">
        <span class="topbar-mark-glyph" aria-hidden="true">§</span>
        <div class="topbar-mark-text">
          <span class="topbar-org">Sterling Industrial Works</span>
          <span class="topbar-product">Procurement Fraud Audit</span>
        </div>
      </div>
      <div class="topbar-session">
        <span class="topbar-session-label">Case</span>
        <span class="topbar-session-value" id="session-case">—</span>
      </div>
    </header>

    <main class="chat" id="chat" aria-live="polite">
      <div class="intro">
        <p>Attach an invoice PDF to start an audit, or ask a question about a case you've already reviewed.</p>
      </div>
    </main>

    <form class="composer" id="composer">
      <label class="attach" for="file-input" id="attach-label" title="Attach an invoice PDF">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 15.5 15.5 7a3 3 0 0 1 4.24 4.24L11 20a5 5 0 0 1-7.07-7.07L12.5 4.36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </label>
      <input type="file" id="file-input" accept="application/pdf" hidden>
      <span class="attach-chip" id="attach-chip" hidden></span>
      <input type="text" id="message-input" placeholder="Can you audit this invoice?" autocomplete="off">
      <button type="submit" id="send-button">Send</button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card" id="modal-card">
    <button type="button" class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="/static/app.js?v=3"></script>
</body>
</html>
